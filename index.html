const dataVersion='20260912-0820';
const STORAGE_KEY='campOrderPay';
const UPDATE_KEY='campOrderPay_updatedAt';
const BACKUP_KEY='campOrderPay_backup';
const MINE_KEY='campOrderMine';
const nameMap={'菱':'小菱','明':'志明','古':'小古','靜':'侑靜','宏':'宏哥','球1':'球球1','球2':'球球2','隸':'曉隸','涵':'詩涵','潔':'依潔'};

let state={};
let draftState={};
let cloudReady=false;
let cloudChannel=null;

function safeParse(raw){
  if(!raw)return null;
  try{const value=JSON.parse(raw);return value&&typeof value==='object'&&!Array.isArray(value)?value:null}catch(e){return null}
}

function localFallbackLoad(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY)||localStorage.getItem(BACKUP_KEY);
    return safeParse(raw)||{};
  }catch(e){return {}}
}

function normaliseState(value){
  const result={...(value||{})};
  Object.keys(nameMap).forEach(oldName=>{
    const newName=nameMap[oldName];
    if(result[oldName]&&!result[newName])result[newName]=result[oldName];
    delete result[oldName];
  });
  people.forEach(p=>{if(!result[p.name])result[p.name]=p.status});
  return result;
}

function stateToRows(s){
  return people.map(p=>({
    person_name:p.name,
    status:s[p.name]||p.status,
    updated_at:new Date().toISOString()
  }));
}

function rowsToState(rows){
  const result={};
  (rows||[]).forEach(r=>{result[r.person_name]=r.status});
  return normaliseState(result);
}

async function loadCloudState(){
  if(!window.SUPABASE_URL || !window.SUPABASE_PUBLISHABLE_KEY ||
     window.SUPABASE_URL.includes('YOUR_')){
    throw new Error('尚未設定 Supabase URL / Publishable Key');
  }
  const {data,error}=await window.supabaseClient
    .from('camp_payment')
    .select('person_name,status,updated_at')
    .eq('event_key',dataVersion);
  if(error)throw error;
  if(!data || !data.length){
    const seed=stateToRows(normaliseState(localFallbackLoad()));
    const {error:seedError}=await window.supabaseClient
      .from('camp_payment').upsert(
        seed.map(r=>({...r,event_key:dataVersion})),
        {onConflict:'event_key,person_name'}
      );
    if(seedError)throw seedError;
    return normaliseState(localFallbackLoad());
  }
  return rowsToState(data);
}

async function initCloud(){
  try{
    if(!window.supabaseClient)throw new Error('Supabase client 初始化失敗');
    state=await loadCloudState();
    draftState={...state};
    cloudReady=true;
    updateSavedHint();
    stats(); home(); pay(); orders(); mine();
    subscribeCloud();
    setCloudStatus('☁ 已連線・資料同步中',false);
  }catch(e){
    console.error('雲端讀取失敗：',e);
    state=normaliseState(localFallbackLoad());
    draftState={...state};
    cloudReady=false;
    updateSavedHint(); stats(); home(); pay(); orders(); mine();
    setCloudStatus('⚠ 雲端未連線・目前使用本機暫存',true);
  }
}

function setCloudStatus(text,isError){
  const hint=document.querySelector('#payHint');
  if(!hint)return;
  let el=document.querySelector('#cloudStatus');
  if(!el){
    el=document.createElement('span');
    el.id='cloudStatus';
    el.style.display='block';
    el.style.marginTop='5px';
    hint.appendChild(el);
  }
  el.textContent=text;
  el.style.color=isError?'#d84a4a':'#25885d';
}

async function persistState(nextState){
  if(!cloudReady){
    toast('雲端尚未連線，無法同步儲存');
    return false;
  }
  try{
    const pwd=document.querySelector('#payPwdInput').value.trim();
    const changes=people
      .filter(p=>nextState[p.name]!==state[p.name])
      .map(p=>({person_name:p.name,status:nextState[p.name]||p.status}));
    if(!changes.length){
      return true;
    }

    for(const change of changes){
      const {data,error}=await window.supabaseClient.rpc(
        'update_camp_payment',
        {
          p_event_key:dataVersion,
          p_person_name:change.person_name,
          p_status:change.status,
          p_password:pwd
        }
      );
      if(error)throw error;
      if(data!==true)throw new Error('雲端拒絕更新');
    }

    const now=new Date().toISOString();
    localStorage.setItem(BACKUP_KEY,JSON.stringify(nextState));
    localStorage.setItem(UPDATE_KEY,now);
    updateSavedHint();
    return true;
  }catch(e){
    console.error('雲端存檔失敗：',e);
    toast('雲端儲存失敗：'+(e.message||'請稍後再試'));
    return false;
  }
}

function subscribeCloud(){
  if(cloudChannel)window.supabaseClient.removeChannel(cloudChannel);
  cloudChannel=window.supabaseClient
    .channel('camp-payment-sync-'+dataVersion)
    .on('postgres_changes',
      {event:'*',schema:'public',table:'camp_payment',filter:'event_key=eq.'+dataVersion},
      payload=>{
        if(payload.eventType==='DELETE')return;
        const row=payload.new;
        if(!row?.person_name)return;
        state[row.person_name]=row.status;
        draftState={...state};
        localStorage.setItem(BACKUP_KEY,JSON.stringify(state));
        localStorage.setItem(UPDATE_KEY,row.updated_at||new Date().toISOString());
        updateSavedHint(); stats(); pay(); mine();
        setCloudStatus('☁ 已同步・剛更新：'+row.person_name,false);
      })
    .subscribe(status=>{
      if(status==='SUBSCRIBED')setCloudStatus('☁ 已連線・即時同步中',false);
    });
}

function openPayPwd(){const m=document.querySelector('#payPwdModal'),i=document.querySelector('#payPwdInput');m.classList.add('show');document.body.classList.add('modal-open');i.value='';setTimeout(()=>i.focus(),50)}
function closePayPwd(){document.querySelector('#payPwdModal').classList.remove('show');document.body.classList.remove('modal-open')}
function updateSavedHint(){
  const el=document.querySelector('#paySavedAt');
  if(!el)return;
  try{
    const t=localStorage.getItem(UPDATE_KEY)||'';
    el.textContent=t?'最後儲存：'+new Date(t).toLocaleString('zh-TW'):'';
  }catch(e){el.textContent=''}
}

async function save(){
  const input=document.querySelector('#payPwdInput');
  const nextState={...draftState};
  const ok=await persistState(nextState);
  if(!ok)return;
  state=nextState;
  draftState={...state};
  document.querySelector('#pay')?.classList.remove('dirty');
  closePayPwd();
  stats(); pay(); mine();
  toast('已成功同步到雲端');
}

function stats(){const paid=people.filter(p=>state[p.name]!=='未繳費');document.querySelector('#topTotal').textContent=money(total);document.querySelector('#topPaid').textContent=paid.length+' / '+people.length+' 人'}
function home(){const entries=Object.entries(storeTotals);document.querySelector('#storeCards').innerHTML=assignments.map((a,i)=>{const s=entries[i]&&entries[i][0]?entries[i][0]:a.store;return `<div class="card task overview-card" role="button" tabindex="0" data-store="${s}" aria-label="查看${s}訂單明細"><div class="task-time">${a.time}</div><div class="overview-main"><b class="store-title">${s}</b></div><div class="owner-pill">${a.owner} 取餐</div></div>`}).join('');document.querySelectorAll('.overview-card').forEach(x=>{x.onclick=()=>openStoreDetail(x.dataset.store);x.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openStoreDetail(x.dataset.store)}}})}
function openStoreDetail(store){const rows=details.filter(d=>d.store===store),sum=rows.reduce((a,d)=>a+d.amount,0),m=document.querySelector('#detailModal');document.querySelector('#modalTitle').textContent=store;document.querySelector('#modalSub').textContent=rows.length+' 筆訂單明細';document.querySelector('#modalBody').innerHTML=rows.map(d=>`<div class="order-row"><div class="order-top"><span class="tag">${d.person}</span><b>${money(d.amount)}</b></div><div class="items">${d.items}</div></div>`).join('')||'<div class="empty">沒有訂單明細</div>';document.querySelector('#modalTotal').textContent=money(sum);m.classList.add('show');document.body.classList.add('modal-open')}
function closeStoreDetail(){document.querySelector('#detailModal').classList.remove('show');document.body.classList.remove('modal-open')}
document.querySelector('#modalClose').onclick=closeStoreDetail;document.querySelector('#detailModal').onclick=e=>{if(e.target.id==='detailModal')closeStoreDetail()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('#detailModal').classList.contains('show'))closeStoreDetail()});
function pay(){const opts=['未繳費','轉帳','LINE Pay','現金'];document.querySelector('#payPeople').innerHTML=people.map(p=>`<div class="card person-card ${draftState[p.name]!=='未繳費'?'paid':''}"><span class="pay-light" title="${draftState[p.name]!=='未繳費'?'已繳':'未繳'}"></span><div class="person-meta"><b>${p.name}</b><div class="sub">應付 ${money(p.total)}</div></div><select class="pay-select" data-name="${p.name}">${opts.map(x=>`<option ${draftState[p.name]===x?'selected':''}>${x}</option>`).join('')}</select></div>`).join('');document.querySelectorAll('.pay-select').forEach(x=>x.onchange=()=>{draftState[x.dataset.name]=x.value;document.querySelector('#pay')?.classList.add('dirty');pay()})}
function groupRows(arr){const g={};arr.forEach(d=>(g[d.person]??=[]).push(d));return g}
function orderRow(d){return `<div class="order-row"><div class="order-top"><span class="tag">${d.store}</span><b>${money(d.amount)}</b></div><div class="items">${d.items}</div></div>`}
function orders(){const q=document.querySelector('#search').value.trim().toLowerCase(),sf=document.querySelector('#storeFilter').value;const arr=details.filter(d=>(!sf||d.store===sf)&&(!q||(d.person+d.store+d.items).toLowerCase().includes(q))),g=groupRows(arr),names=people.map(p=>p.name).filter(n=>g[n]);document.querySelector('#resultCount').textContent=names.length+' 人 · '+arr.length+' 筆';document.querySelector('#orderPeople').innerHTML=names.map(n=>`<div class="card person-order"><button class="person-head"><div><b>${n}</b><div class="sub">${g[n].length} 筆訂單</div></div><strong>${money(g[n].reduce((a,d)=>a+d.amount,0))} ⌄</strong></button><div class="order-body">${g[n].map(orderRow).join('')}</div></div>`).join('')||'<div class="empty">沒有符合條件的訂單</div>';document.querySelectorAll('.person-head').forEach(x=>x.onclick=()=>x.parentElement.classList.toggle('open'))}
function mine(){const n=document.querySelector('#myPerson').value||people[0].name;try{localStorage.setItem(MINE_KEY,n)}catch(e){}const p=people.find(x=>x.name===n),rows=details.filter(d=>d.person===n),st=state[n]||draftState[n]||p.status,paid=st!=='未繳費';document.querySelector('#mySummary').innerHTML=`<div class="my-brief"><div class="mini"><small>應付金額</small><b>${money(p.total)}</b></div><div class="mini"><small>繳費狀態</small><b class="${paid?'status-paid':'status-unpaid'}">${st}</b></div></div>`;document.querySelector('#myContent').innerHTML=`<div class="section-title"><h2>訂購內容</h2><span>${rows.length} 筆</span></div><div class="card person-order open"><div class="order-body" style="display:block">${rows.map(orderRow).join('')}</div></div>`}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.screen').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector('#'+b.dataset.page).classList.add('active');scrollTo(0,0)});const f=document.querySelector('#storeFilter');Object.keys(storeTotals).forEach(s=>f.insertAdjacentHTML('beforeend',`<option>${s}</option>`));document.querySelector('#search').oninput=orders;f.onchange=orders;const mp=document.querySelector('#myPerson');people.forEach(p=>mp.insertAdjacentHTML('beforeend',`<option>${p.name}</option>`));let savedMine='';try{savedMine=localStorage.getItem(MINE_KEY)||''}catch(e){}if(savedMine&&people.some(p=>p.name===savedMine))mp.value=savedMine;else if(people.some(p=>p.name==='依潔'))mp.value='依潔';mp.onchange=mine;document.querySelector('#savePayBtn').onclick=openPayPwd;document.querySelector('#pwdClose').onclick=closePayPwd;document.querySelector('#pwdCancel').onclick=closePayPwd;document.querySelector('#pwdConfirm').onclick=save;document.querySelector('#payPwdInput').onkeydown=e=>{if(e.key==='Enter')save()};document.querySelector('#payPwdModal').onclick=e=>{if(e.target.id==='payPwdModal')closePayPwd()};
function openPayInfo(){document.querySelector('#payInfoModal').classList.add('show');document.body.classList.add('modal-open')}function closePayInfo(){document.querySelector('#payInfoModal').classList.remove('show');document.body.classList.remove('modal-open')}document.querySelector('#payInfoBtn').onclick=openPayInfo;document.querySelector('#payInfoClose').onclick=closePayInfo;document.querySelector('#payInfoModal').onclick=e=>{if(e.target.id==='payInfoModal')closePayInfo()};let deferred;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;document.querySelector('#installBtn').style.display='block'});document.querySelector('#installBtn').onclick=async()=>{if(deferred){deferred.prompt();deferred=null}};(()=>{try{if(window.isSecureContext&&location.protocol!=='about:'&&('serviceWorker' in navigator))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}catch(e){}})();window.addEventListener('storage',e=>{
  if(e.key!==STORAGE_KEY)return;
  const incoming=safeParse(e.newValue);
  if(!incoming)return;
  state=incoming;
  draftState={...state};
  document.querySelector('#pay')?.classList.remove('dirty');
  updateSavedHint();stats();pay();mine();
});
updateSavedHint();stats();home();pay();orders();mine();initCloud();
