const dataVersion='20260912-0901';
const STORAGE_KEY='campOrderPay';
const UPDATE_KEY='campOrderPay_updatedAt';
const BACKUP_KEY='campOrderPay_backup';
const MINE_KEY='campOrderMine';

const SUPABASE_URL = 'https://kpsdzkpytazpoiglfhgi.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_ND9bkCqm9oKMng2vDGnZVA_FBEEq8Bi';
const CLOUD_TABLE = 'camp_order_payments';
const CLOUD_EVENT = 'camp-order-payments-updated';

let cloudReady = false;
let cloudSyncing = false;
let cloudChannel = null;

function isCloudConfigured(){
  return SUPABASE_URL.startsWith('https://') &&
         SUPABASE_PUBLISHABLE_KEY &&
         !SUPABASE_URL.includes('YOUR_') &&
         !SUPABASE_PUBLISHABLE_KEY.includes('YOUR_');
}

const supabaseClient = isCloudConfigured()
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY)
  : null;

function normalizeCloudRows(rows){
  const result = {};
  (rows || []).forEach(row => {
    if(row && row.person) result[row.person] = row.status || '未繳費';
  });
  return result;
}

async function cloudLoad(){
  if(!supabaseClient) return null;
  try{
    const {data, error} = await supabaseClient
      .from(CLOUD_TABLE)
      .select('person,status,updated_at')
      .eq('event_id', dataVersion);
    if(error) throw error;
    cloudReady = true;
    return normalizeCloudRows(data);
  }catch(e){
    console.warn('雲端讀取失敗，改用本機資料：', e);
    cloudReady = false;
    return null;
  }
}

async function cloudSave(nextState){
  if(!supabaseClient) return false;
  try{
    cloudSyncing = true;
    const now = new Date().toISOString();
    const rows = people.map(p => ({
      event_id: dataVersion,
      person: p.name,
      status: nextState[p.name] || '未繳費',
      updated_at: now
    }));
    const {error} = await supabaseClient
      .from(CLOUD_TABLE)
      .upsert(rows, {onConflict:'event_id,person'});
    if(error) throw error;
    cloudReady = true;
    return true;
  }catch(e){
    console.error('雲端儲存失敗：', e);
    toast('雲端更新失敗，請檢查網路或 Supabase 設定');
    return false;
  }finally{
    cloudSyncing = false;
  }
}

function setupCloudRealtime(){
  if(!supabaseClient) return;
  cloudChannel = supabaseClient
    .channel('camp-order-payments-live')
    .on('postgres_changes',
      {event:'*', schema:'public', table:CLOUD_TABLE, filter:`event_id=eq.${dataVersion}`},
      payload => {
        if(cloudSyncing) return;
        const row = payload.new || payload.old;
        if(!row || row.event_id !== dataVersion) return;
        if(payload.eventType === 'DELETE') delete state[row.person];
        else state[row.person] = row.status || '未繳費';
        draftState = {...state};
        try{
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          localStorage.setItem(BACKUP_KEY, JSON.stringify(state));
          localStorage.setItem(UPDATE_KEY, row.updated_at || new Date().toISOString());
        }catch(e){}
        updateSavedHint();
        stats(); pay(); mine();
        toast('已同步最新繳費狀態');
      })
    .subscribe();
}

async function initCloud(){
  if(!supabaseClient){
    updateSavedHint();
    return;
  }
  const cloudState = await cloudLoad();
  if(cloudState){
    state = {...state, ...cloudState};
    people.forEach(p => { if(!state[p.name]) state[p.name] = p.status; });
    draftState = {...state};
    try{
      const json = JSON.stringify(state);
      localStorage.setItem(STORAGE_KEY, json);
      localStorage.setItem(BACKUP_KEY, json);
      localStorage.setItem(UPDATE_KEY, new Date().toISOString());
    }catch(e){}
    updateSavedHint();
    stats(); pay(); mine();
    setupCloudRealtime();
  }else{
    toast('目前使用本機資料');
  }
}

const LEGACY_KEYS=['campOrderPay_20260912'];
const nameMap={'菱':'小菱','明':'志明','古':'小古','靜':'侑靜','宏':'宏哥','球1':'球球1','球2':'球球2','隸':'曉隸','涵':'詩涵','潔':'依潔'};

function safeParse(raw){
  if(!raw)return null;
  try{const value=JSON.parse(raw);return value&&typeof value==='object'&&!Array.isArray(value)?value:null}catch(e){return null}
}
function loadState(){
  let loaded=null;
  try{
    loaded=safeParse(localStorage.getItem(STORAGE_KEY));
    if(!loaded)loaded=safeParse(localStorage.getItem(BACKUP_KEY));
    if(!loaded){
      for(const legacyKey of LEGACY_KEYS){
        loaded=safeParse(localStorage.getItem(legacyKey));
        if(loaded)break;
      }
    }
  }catch(e){console.error('讀取本機資料失敗：',e)}
  const result=loaded||{};
  Object.keys(nameMap).forEach(oldName=>{
    const newName=nameMap[oldName];
    if(result[oldName]&&!result[newName])result[newName]=result[oldName];
    delete result[oldName];
  });
  people.forEach(p=>{if(!result[p.name])result[p.name]=p.status});
  return result;
}
let state=loadState();
let draftState={...state};
function openPayPwd(){const m=document.querySelector('#payPwdModal'),i=document.querySelector('#payPwdInput');m.classList.add('show');document.body.classList.add('modal-open');i.value='';setTimeout(()=>i.focus(),50)}
function closePayPwd(){document.querySelector('#payPwdModal').classList.remove('show');document.body.classList.remove('modal-open')}
function updateSavedHint(){
  const cloudEl=document.querySelector('#payCloudStatus'); if(cloudEl) cloudEl.textContent=supabaseClient?(cloudReady?' ☁ 已連線':' ☁ 連線中…'):' ☁ 尚未設定';
  const el=document.querySelector('#paySavedAt');
  if(!el)return;
  try{
    const t=localStorage.getItem(UPDATE_KEY)||'';
    el.textContent=t?'最後儲存：'+new Date(t).toLocaleString('zh-TW'):'';
  }catch(e){el.textContent=''}
}
function persistLocalState(nextState){
  try{
    const json=JSON.stringify(nextState);
    localStorage.setItem(STORAGE_KEY,json);
    localStorage.setItem(BACKUP_KEY,json);
    localStorage.setItem(UPDATE_KEY,new Date().toISOString());
    updateSavedHint();
    return true;
  }catch(e){
    console.error('本機存檔失敗：',e);
    toast('本機存檔失敗');
    return false;
  }
}
async function save(){
  const input=document.querySelector('#payPwdInput');
  const pwd=input.value.trim();
  if(pwd!=='0912'){
    toast('密碼錯誤，未儲存');
    input.value='';
    input.focus();
    return;
  }
  const nextState={...draftState};
  if(!persistLocalState(nextState))return;

  if(supabaseClient){
    toast('正在更新雲端…');
    const ok = await cloudSave(nextState);
    if(!ok){
      return;
    }
  }

  state=nextState;
  draftState={...state};
  document.querySelector('#pay')?.classList.remove('dirty');
  closePayPwd();
  stats();
  pay();
  mine();
  updateSavedHint();
  toast(supabaseClient ? '已同步到雲端' : '已儲存在本機');
}
